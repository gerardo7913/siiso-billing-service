spring:
  application:
    name: billing-service
  # Local secrets live in .env (git-ignored); see .env.example.
  config:
    import: optional:file:.env[.properties]

  # siiso_business (siiso-docs ADR 0016): this service owns the billing_* tables and reads companies,
  # services and catalogs through views, with its own MySQL user (role siiso_billing_service).
  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://127.0.0.1:3306/siiso_business?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${BILLING_DB_USERNAME:siiso_billing}
    password: ${BILLING_DB_PASSWORD}
    hikari:
      pool-name: billing
      maximum-pool-size: 10
  # siiso_business is migrated by siiso-business-db before the services start; this service only
  # checks the schema version it needs.
  flyway:
    enabled: false

  jackson:
    # Same JSON convention as security-service.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

siiso:
  business-db:
    required-version: 13
  security:
    jwt:
      issuer: siiso
      # Public key of this installation's security-service (PEM file). Required: no default.
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Import of the legacy rates (tarifa) as rate plans (idempotent, at startup; siiso-docs ADR 0022).
  legacy-import:
    enabled: ${LEGACY_IMPORT_ENABLED:false}
  # Legacy database (read-only). Leave LEGACY_DB_URL empty to run without it.
  legacy:
    datasource:
      url: ${LEGACY_DB_URL:}
      username: ${LEGACY_DB_USERNAME:}
      password: ${LEGACY_DB_PASSWORD:}
      hikari:
        maximum-pool-size: 10
        read-only: true
    # Write-back of each company's prices of the day while the legacy DB is deprecated (ADR 0006). A
    # dedicated user with rights on tarifa and empresa.DEPENDENCIA_EMPRESA only. Empty = changes wait in
    # the outbox.
    writer:
      username: ${LEGACY_WRITE_DB_USERNAME:}
      password: ${LEGACY_WRITE_DB_PASSWORD:}
      interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  level:
    com.siiso.billing: INFO
